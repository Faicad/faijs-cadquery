name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep this workflow STEP-ALIGNED with scripts/ci.ps1 (local Windows CI).
# Both pipelines must run the same logical stages in the same order:
#   lint -> typecheck -> build -> test (+stderr zero tolerance) -> pack.
# If you add/remove/reorder a step here, mirror it in ci.ps1 (and vice versa).
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # 2/5 — typecheck before build: legal-ESM fix-import-extensions runs at build.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 3/5 — build produces dist/. The parity-smoke CLI subprocess resolves
      # @faicad/faijs-cadquery via node_modules (self-link from the file:. devDep)
      # to dist, so dist must exist on a fresh checkout before tests run.
      - name: Build
        run: npm run build

      # 4/5 — run the suite under the same hard external watchdog as ci.ps1,
      # with stderr zero tolerance (a failing native call leaks "stderr |" lines).
      - name: Test (hard watchdog + stderr zero tolerance)
        run: |
          set -o pipefail
          node scripts/run-tests-with-watchdog.mjs --budget-ms "${FAIJS_TEST_BUDGET_MS:-300000}" -- npm run test 2>&1 | tee vitest-ci.log
          rc=$?
          # Zero stderr tolerance: any test writing "stderr |" lines fails CI.
          if grep -E '^stderr \|' vitest-ci.log; then
            echo "::error::Tests produced stderr output — all test stderr must be resolved."
            rc=1
          fi
          rm -f vitest-ci.log
          exit $rc

      # 5/5
      - name: npm pack (local packability)
        run: npm pack